<!-- 基础用法：水平分隔线导航 -->
<div class="ul-nav-link">
    <a class="ul-nav-link__item">导航1</a>
    <a class="ul-nav-link__item">导航2</a>
    <a class="ul-nav-link__item">导航3</a>
    <a class="ul-nav-link__item">导航4</a>
</div>

<!-- 状态控制示例 -->
<div class="ul-nav-link">
    <a class="ul-nav-link__item active">激活状态</a>
    <a class="ul-nav-link__item">普通状态</a>
    <a class="ul-nav-link__item disabled">禁用状态</a>
</div>

<!-- 垂直排列示例 -->
<div class="ul-nav-link vertical">
    <a class="ul-nav-link__item">垂直导航1</a>
    <a class="ul-nav-link__item">垂直导航2</a>
    <a class="ul-nav-link__item">垂直导航3</a>
</div>

<!-- 无分隔线示例 -->
<div class="ul-nav-link no-divider">
    <a class="ul-nav-link__item">无分隔线1</a>
    <a class="ul-nav-link__item">无分隔线2</a>
    <a class="ul-nav-link__item">无分隔线3</a>
</div>
