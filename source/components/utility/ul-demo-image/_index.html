{volist name='demo_type' id='vo'}
<div class="ul-title-section">ul-demo-{$vo}</div>
{for start='1' end='10'}
    {if in_array($vo, ['avatar', 'icon'])}
        <div class="ul-inline-block ul-demo-{$vo} n{$i}" style="width: 80px;height: 80px;"></div>
        {else /}
        <div class="ul-inline-block ul-demo-{$vo} n{$i}" style="width: 120px;height: 80px;"></div>
    {/if}
{/for}
{/volist}
