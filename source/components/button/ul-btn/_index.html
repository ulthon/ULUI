<div class="ul-group-title"> 基本按钮 </div>
{volist name='button_list' id='type_list'}
<div class="ul-section">
    {volist name='type_list' id='button'}
    <button class="{$button.class}">{$button.name}</button>
    {/volist}
</div>
{/volist}
{foreach $button_status as $status => $status_name}
<div class="ul-group-title"> {$status_name} </div>
{volist name='button_list' id='type_list'}
<div class="ul-section">
    {volist name='type_list' id='button'}
    <button class="{$button.class} {$status}">{$button.name}</button>
    {/volist}
</div>
{/volist}
{/foreach}
